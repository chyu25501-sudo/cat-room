name: Supabase Keep-Alive Ping

on:
  schedule:
    # 4日おきに1回（午前0時 UTC / 日本時間 午前9時）自動実行してスリープを防止
    - cron: '0 0 */4 * *'
  # GitHub 上の Actions タブから手動でいつでも即座に実行可能
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL または SUPABASE_ANON_KEY が GitHub Secrets に設定されていません。"
            exit 1
          fi

          echo "Pinging Supabase REST endpoint to keep project active..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Keep-alive ping succeeded!"
          else
            echo "::warning::Unexpected HTTP status $STATUS received."
          fi
